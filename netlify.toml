# Seismic Pulse — derleme adımı yok, klasörün kendisi yayınlanır.
[build]
  publish = "."

# Veri dosyaları sık değişir: tarayıcı her seferinde yenisini sorsun.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
